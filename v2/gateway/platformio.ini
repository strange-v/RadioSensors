[platformio]
default_envs = gateway_wt32_eth01, gateway_waveshare_s3_eth

[gateway]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D GATEWAY_FIRMWARE_VERSION=\"0.0.0\"
    -D CORE_DEBUG_LEVEL=0

[env:gateway_wt32_eth01]
extends = gateway
board = wt32-eth01
build_flags =
    ${gateway.build_flags}
    -D GATEWAY_BOARD_WT32_ETH01

[env:gateway_waveshare_s3_eth]
extends = gateway
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
build_flags =
    ${gateway.build_flags}
    -D GATEWAY_BOARD_WAVESHARE_S3_ETH

